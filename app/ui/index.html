<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>dogani Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">
  <div id="root">
    <section id="panel">
      <!-- 할일 창 -->
      <div id="view-note" class="view" hidden>
        <div class="panel-bar" title="드래그해서 이동">
          <button class="icon-btn" id="note-prev" title="이전 근무일">&#x2039;</button>
          <div class="header-title" id="note-title"></div>
          <button class="icon-btn" id="note-next" title="다음 근무일">&#x203A;</button>
          <button class="text-btn" id="note-today">오늘</button>        </div>
        <div class="space-tabs" id="note-tabs" hidden></div>
        <div class="progress-row" id="note-progress">
          <div class="progress"><div class="progress-bar" id="note-bar"></div></div>
          <span class="progress-text" id="note-count"></span>
        </div>
        <div class="sched-row" id="note-sched" hidden></div>
        <article id="note-body" class="markdown-rendered"></article>
        <footer class="view-footer" id="note-footer"></footer>
      </div>

      <!-- 달력 창 -->
      <div id="view-cal" class="view" hidden>
        <div class="panel-bar" title="드래그해서 이동">
          <div class="bar-side"></div>
          <div class="cal-nav">
            <button class="icon-btn" id="cal-prev" title="이전 달">&#x2039;</button>
            <div class="header-title" id="cal-title"></div>
            <button class="icon-btn" id="cal-next" title="다음 달">&#x203A;</button>
          </div>
          <div class="bar-side right"><button class="icon-btn" id="cal-layout" title="필터를 오른쪽에 세로로 보기"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="2"/><path class="lay-top" d="M2 6.5h12"/><path class="lay-side" d="M10.5 3v10"/></svg></button></div>
        </div>
        <div class="cal-main">
        <!-- 달력에 일정을 보일 스페이스 (체크 끄면 숨김, 할일 창 일정 줄도 같이) -->
        <div class="cal-filters">
          <div id="cal-spaces" class="cal-spaces" hidden></div>
          <!-- 아래 세 묶음: 사이드바에서 제목 클릭 = 접기, 제목 끌기 = 순서 바꾸기 (calendar.js initSections) -->
          <!-- 스페이스의 멤버 그룹 (@그룹. 끄면 그 그룹 일정 숨김, 마우스 = 구성원·권한 카드) -->
          <div class="cal-sec" data-sec="groups"><div class="cal-sec-h">멤버 그룹</div><div id="cal-groups" class="cal-spaces cal-tags" hidden></div></div>
          <!-- 보이는 달 일정의 @멤버 (끄면 그 멤버 일정 숨김), 맨 끝 "멤버 없는 일정" -->
          <div class="cal-sec" data-sec="members"><div class="cal-sec-h">멤버</div><div id="cal-members" class="cal-spaces cal-tags" hidden></div></div>
          <!-- 보이는 달에 쓴 태그 (끄면 그 태그 일정 숨김), 맨 끝 "태그 없는 일정" -->
          <div class="cal-sec" data-sec="tags"><div class="cal-sec-h">태그</div><div id="cal-tags" class="cal-spaces cal-tags" hidden></div></div>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
        </div>
        <div id="ev-tagtip" class="ev-tagtip" hidden></div>
        <footer class="view-footer" id="cal-footer"></footer>
        <form id="ev-add" class="ev-add" hidden autocomplete="off">
          <div class="seg-row" id="ev-add-seg">
          <div class="seg">
            <button type="button" data-kind="event" title="하는 일: 회의·실사·발표 등 (여러 날이면 띠로 표시)">일정</button>
            <button type="button" data-kind="span" title="이어지는 상태: 출장·교육·마감까지 등 (화살표로 표시)">기간</button>
          </div>
          <div class="seg">
            <button type="button" data-kind="off" title="사람과 제목만: 연차·반차 등 (날짜 줄에 빨간 글자). 사람을 비우면 회사 휴무처럼 모두 쉬는 날">근태</button>
          </div>
          </div>
          <input type="text" id="ev-add-name" class="ev-add-name" placeholder="제목" required>
          <div class="ev-add-opts not-off">
            <label><input type="checkbox" id="ev-add-bold">중요</label>
            <label title="정확한 시각 모름, 그 사이 언젠가"><input type="checkbox" id="ev-add-about">애매함</label>
          </div>
          <div class="ev-add-grid">
            <span class="k" title="여러 개 고르면 각 스페이스 일정 파일에 같은 줄을 넣음">스페이스</span>
            <div class="v ev-add-opts" id="ev-add-spaces"></div>
            <span class="k">날짜</span>
            <div class="v">
              <input type="date" id="ev-add-start"><span class="sep">-</span><input type="date" id="ev-add-end">
            </div>
            <span class="k not-off">시간</span>
            <div class="v not-off">
              <select id="ev-add-t1"></select><span class="sep">-</span><select id="ev-add-t2"></select>
            </div>
            <span class="k k-top not-off">태그</span>
            <div class="v v-tags not-off"><input type="text" id="ev-add-tags" placeholder="쉼표로 구분  예) 과제, 교육">
              <div id="ev-add-tagpick" class="ev-add-tagpick" hidden></div></div>
            <span class="k k-top" title="일정에 든 사람 (@이름). 만든 사람과 따로">멤버</span>
            <div class="v v-tags"><input type="text" id="ev-add-members" placeholder="쉼표로 구분  예) 홍길동, 김철수">
              <div id="ev-add-mempick" class="ev-add-tagpick" hidden></div></div>
            <span class="k not-off">장소</span>
            <div class="v not-off"><input type="text" id="ev-add-place"></div>
            <span class="k" id="ev-add-memo-k" hidden>메모</span>
            <div class="v" id="ev-add-memo-row" hidden><input type="text" id="ev-add-memo"></div>
          </div>
          <div class="ev-add-hint" id="ev-add-hint"></div>
          <div class="ev-add-err" id="ev-add-err"></div>
          <div class="ev-add-btns">
            <button type="button" class="text-btn" id="ev-add-memo-btn">+ 메모</button>
            <button type="button" class="text-btn danger" id="ev-add-del" hidden>삭제</button>
            <span class="grow"></span>
            <button type="button" class="text-btn" id="ev-add-cancel">취소</button>
            <button type="submit" class="text-btn active" id="ev-add-ok">추가</button>
          </div>
        </form>
      </div>

      <!-- 가장자리 크기 조절 (네 변·네 모서리). data-e = Qt.Edge 비트: 위1 왼2 오4 아래8 -->
      <div class="rz" data-e="1"></div><div class="rz" data-e="8"></div>
      <div class="rz" data-e="2"></div><div class="rz" data-e="4"></div>
      <div class="rz" data-e="3"></div><div class="rz" data-e="5"></div>
      <div class="rz" data-e="10"></div><div class="rz" data-e="12"></div>
    </section>
  </div>

  <script src="vendor/editor.js"></script>
  <script src="markdown.js"></script>
  <script src="calendar.js"></script>
  <script src="app.js"></script>
</body>
</html>
